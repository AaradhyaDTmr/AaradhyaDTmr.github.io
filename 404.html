<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO & Canonical Authority Transfer -->
  <title>Redirecting to Aaradhya Dev Tamrakar's Portfolio...</title>
  <meta name="description" content="The portfolio of Aaradhya Dev Tamrakar has permanently moved to https://aaradhyadt.github.io/." />
  <link rel="canonical" href="https://aaradhyadt.github.io/" />
  
  <!-- Instant Meta Refresh -->
  <meta http-equiv="refresh" content="0; url=https://aaradhyadt.github.io/" />

  <!-- JavaScript Instant Redirect -->
  <script>
    (function () {
      var pathname = window.location.pathname.replace(/^\/+/, "");
      var target = "https://aaradhyadt.github.io/" + (pathname ? pathname : "") + (window.location.search || "") + (window.location.hash || "");
      window.location.replace(target);
    })();
  </script>

  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: rgba(18, 26, 43, 0.85);
      --border: rgba(99, 140, 237, 0.25);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --glow: rgba(59, 130, 246, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .redirect-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px var(--glow);
      backdrop-filter: blur(12px);
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 1.5rem auto;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .redirect-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .redirect-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .redirect-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Redirecting...</h1>
    <p>This page has permanently moved to <strong>aaradhyadt.github.io</strong>.</p>
    <a class="redirect-btn" href="https://aaradhyadt.github.io/">
      <span>Go to New Domain</span>
      <span aria-hidden="true">→</span>
    </a>
  </main>
</body>
</html>
